java.toolchain.languageVersion = JavaLanguageVersion.of(platformJava)
base.archivesName = "ecera-neoforge-$minecraftVersion"

sourceSets.main.java.srcDir('../shared/src/main/java')
if (file('../../minecraft/shared/src/main/java').isDirectory()) {
    sourceSets.main.java.srcDir('../../minecraft/shared/src/main/java')
}

def mheraVersion = providers.gradleProperty('mhera_version').getOrElse('2.0.0')
def mheraLibsDir = rootProject.file(
        providers.gradleProperty('mhera_libs_dir')
                .orElse(providers.environmentVariable('ECERA_MHERA_LIBS_DIR'))
                .getOrElse('../.mhera-libs')
)
def mheraJar = new File(mheraLibsDir, "mhera-neoforge-${minecraftVersion}-${mheraVersion}.jar")
if (!mheraJar.isFile()) {
    throw new GradleException("Required Machinera (mhera) ${mheraVersion} JAR not found at ${mheraJar.absolutePath}")
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    implementation project(':common')
    // Compile against Machinera (mhera) ${mheraVersion} and load it in dev runs, but NEVER bundle it inside Ecolera's JAR.
    compileOnly files(mheraJar)
    localRuntime files(mheraJar)
}

apply from: rootProject.file('gradle/optional-mods.gradle')

neoForge {
    enable {
        version = neoForgeVersion
        disableRecompilation = true
    }
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            if (platformJava == 21) {
                data()
            } else {
                clientData()
            }
            programArguments.addAll '--mod', 'ecera', '--all', '--output', file('src/generated/resources').absolutePath
        }
    }
    mods {
        ecera {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

def generatedEceraResources = layout.buildDirectory.dir('generated/ecera-resources')
def dataGeneratorScript = rootProject.file('assets-gen/generate_data.py')
def generateEceraResources = tasks.register('generateEceraResources', Exec) {
    onlyIf { dataGeneratorScript.isFile() }
    inputs.property('minecraftTarget', minecraftVersion)
    if (dataGeneratorScript.isFile()) {
        inputs.file(dataGeneratorScript)
        inputs.files(rootProject.fileTree('assets-gen') {
            include '*.py', '*.json', '*.tsv'
        })
    }
    outputs.dir(generatedEceraResources)
    commandLine providers.gradleProperty('ecera.python').getOrElse('python3'),
            dataGeneratorScript,
            '--target', "neoforge-$minecraftVersion",
            '--output', generatedEceraResources.get().asFile
}

tasks.named('processResources') {
    dependsOn generateEceraResources
    filteringCharset = 'UTF-8'
    inputs.properties(
            version: project.version,
            neoForgeVersion: neoForgeVersion,
            minecraftVersion: minecraftVersion,
            loaderMetadata: loaderMetadata
    )
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    includeEmptyDirs = false
    doFirst { delete destinationDir }
    if (rootProject.file('assets').isDirectory()) {
        from(rootProject.file('assets')) {
            exclude 'qa/**', 'brand/**'
            into 'assets'
            exclude '**/*.md', '**/*.csv', '**/.git*', '**/.DS_Store'
        }
    }
    from(generatedEceraResources) {
        exclude '.ecera-generated-output'
    }
    from('../metadata') {
        expand version: project.version,
                neoForgeVersion: neoForgeVersion,
                minecraftVersion: minecraftVersion,
                loaderMetadata: loaderMetadata
    }
}

tasks.named('jar') {
    from project(':common').sourceSets.main.output
    from(rootProject.file('LICENSE'))
    from(rootProject.file('COPYING'))
    from(rootProject.file('LICENSE-ASSETS'))
    inputs.file(rootProject.file('NOTICE.md'))
    from(rootProject.file('NOTICE.md'))
}
