plugins {
    id 'java'
    id 'net.minecraftforge.gradle'
}

ext {
    minecraftVersion = minecraft_version
}

base.archivesName = "ecera-forge-${minecraft_version}"

def repoRoot = rootProject.file('..')
def mheraLibsDir = rootProject.file(
        providers.gradleProperty('mhera_libs_dir')
                .orElse(providers.environmentVariable('ECERA_MHERA_LIBS_DIR'))
                .getOrElse('../../.mhera-libs')
)
def mheraJar = new File(mheraLibsDir, "mhera-forge-${minecraft_version}-${mhera_version}.jar")
if (!mheraJar.isFile()) {
    throw new GradleException("Required Machinera (mhera) ${mhera_version} Forge 1.19.2 JAR not found at ${mheraJar.absolutePath}")
}

repositories {
    flatDir {
        name = 'LocalMheraLibs'
        dirs mheraLibsDir
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDirectory layout.buildDirectory.dir("run/$name").get().asFile
            property 'forge.logging.console.level', 'info'
            arg '-mixin.config=ecera.mixins.json'
            mods {
                ecera {
                    source sourceSets.main
                    source project(':common').sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation project(':common')

    // Compile against deobfuscated Machinera (mhera) and load in dev runs, NEVER bundle inside ecera JAR.
    def mheraDeobf = fg.deobf("com.industrialage.ia2:mhera-forge-${minecraft_version}:${mhera_version}")
    compileOnly mheraDeobf
    localRuntime mheraDeobf

    // SpongePowered Mixin annotation processor for compile-time validation & refmap generation.
    annotationProcessor 'org.spongepowered:mixin:0.8.5'
    annotationProcessor('com.google.guava:guava:31.0.1-jre') { transitive = false }
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    annotationProcessor 'org.ow2.asm:asm:9.7.1'
    annotationProcessor 'org.ow2.asm:asm-tree:9.7.1'
    annotationProcessor 'org.ow2.asm:asm-commons:9.7.1'
    annotationProcessor 'org.ow2.asm:asm-util:9.7.1'
}

apply from: new File(repoRoot, 'gradle/optional-mods.gradle')

def mixinRefMapFile = layout.buildDirectory.file('mixin/ecera.refmap.json')

tasks.named('compileJava', JavaCompile) {
    dependsOn tasks.named('createMcpToSrg')
    outputs.file(mixinRefMapFile)
    doFirst {
        def refmap = mixinRefMapFile.get().asFile
        refmap.parentFile.mkdirs()
        def tsrg = tasks.named('createMcpToSrg').get().output.get().asFile
        options.compilerArgs.addAll([
                "-AreobfTsrgFile=${tsrg.absolutePath}",
                "-AoutRefMapFile=${refmap.absolutePath}",
                '-AdefaultObfuscationEnv=searge'
        ])
    }
    doLast {
        def refmap = mixinRefMapFile.get().asFile
        if (!refmap.exists()) {
            refmap.parentFile.mkdirs()
            refmap.text = '{"mappings":{},"data":{"searge":{}}}\n'
        }
    }
}

def generatedEceraResources = layout.buildDirectory.dir('generated/ecera-resources')
def dataGeneratorScript = new File(repoRoot, 'assets-gen/generate_data.py')

def generateEceraResources = tasks.register('generateEceraResources', Exec) {
    onlyIf { dataGeneratorScript.isFile() }
    inputs.property('minecraftTarget', 'forge-1.19.2')
    if (dataGeneratorScript.isFile()) {
        inputs.file(dataGeneratorScript)
        inputs.files(fileTree(new File(repoRoot, 'assets-gen')) {
            include '*.py', '*.json', '*.tsv'
        })
    }
    outputs.dir(generatedEceraResources)
    commandLine providers.gradleProperty('ecera.python').getOrElse('python3'),
            dataGeneratorScript.absolutePath,
            '--target', 'forge-1.19.2',
            '--output', generatedEceraResources.get().asFile.absolutePath
}

tasks.named('processResources') {
    dependsOn generateEceraResources
    filteringCharset = 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    includeEmptyDirs = false
    inputs.properties(
            version: project.version,
            minecraftVersion: minecraft_version,
            forgeVersion: forge_version
    )
    doFirst { delete destinationDir }
    filesMatching('META-INF/mods.toml') {
        expand version: project.version,
                minecraftVersion: minecraft_version,
                forgeVersion: forge_version
    }
    def sharedAssets = new File(repoRoot, 'assets')
    if (sharedAssets.isDirectory()) {
        from(sharedAssets) {
            exclude 'qa/**', 'brand/**'
            into 'assets'
            exclude '**/*.md', '**/*.csv', '**/.git*', '**/.DS_Store'
        }
    }
    from(generatedEceraResources) {
        exclude '.ecera-generated-output'
    }
}

tasks.named('jar') {
    dependsOn tasks.named('compileJava')
    manifest {
        attributes(
                'Specification-Title': 'Ecolera',
                'Specification-Vendor': 'Ecolera Contributors',
                'Specification-Version': '1',
                'Implementation-Title': 'ecera',
                'Implementation-Version': project.version,
                'MixinConfigs': 'ecera.mixins.json'
        )
    }
    from project(':common').sourceSets.main.output
    from(mixinRefMapFile)
    from(new File(repoRoot, 'LICENSE'))
    from(new File(repoRoot, 'COPYING'))
    from(new File(repoRoot, 'LICENSE-ASSETS'))
    inputs.file(new File(repoRoot, 'NOTICE.md'))
    from(new File(repoRoot, 'NOTICE.md'))
    finalizedBy 'reobfJar'
}
