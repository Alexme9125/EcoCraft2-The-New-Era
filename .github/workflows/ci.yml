name: CI Build & Verification

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  MHERA_VERSION: "2.0.0"
  MHERA_RELEASE_URL: "https://github.com/spectrum527/Machinera/releases/download/v2.0.0"

jobs:
  assets-and-cleanroom:
    name: Assets & Clean-Room Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Fetch verified Machinera 2.0.0 reference JAR (external to repo)
        run: |
          mkdir -p ../.mhera-libs
          curl -fsSL "$MHERA_RELEASE_URL/mhera-neoforge-1.21.1-$MHERA_VERSION.jar" -o ../.mhera-libs/mhera-neoforge-1.21.1-$MHERA_VERSION.jar

      - name: Verify textures, GUI coordinates, lang parity, and 4-target datagen
        run: python3 assets-gen/verify_assets.py

      - name: Run clean-room repository audit
        run: python3 tools/ci/audit_jars.py --cleanroom-only

  neoforge:
    name: NeoForge ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["1.21.1", "26.1.2", "26.2"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 17
        id: java17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Temurin 25
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Temurin 21 (Gradle JVM)
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Gradle wrapper checksum
        run: sha256sum -c gradle/wrapper/gradle-wrapper.jar.sha256

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch verified Machinera 2.0.0 NeoForge JARs (external to repo)
        run: |
          mkdir -p ../.mhera-libs
          for ver in 1.21.1 26.1.2 26.2; do
            curl -fsSL "$MHERA_RELEASE_URL/mhera-neoforge-${ver}-$MHERA_VERSION.jar" -o "../.mhera-libs/mhera-neoforge-${ver}-$MHERA_VERSION.jar"
          done

      - name: Build common, run JUnit 5 suite, and package NeoForge ${{ matrix.target }} JAR
        run: |
          ./gradlew :common:build :test:test :neoforge:${{ matrix.target }}:jar \
            --no-daemon --console=plain \
            -Porg.gradle.java.installations.paths="${{ steps.java17.outputs.path }},${{ steps.java21.outputs.path }},${{ steps.java25.outputs.path }}"

      - name: Audit packaged JAR
        run: |
          python3 tools/ci/audit_jars.py \
            --jar "src/neoforge/${{ matrix.target }}/build/libs/ecera-neoforge-${{ matrix.target }}-2.0.0.jar" \
            --target "neoforge-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecera-neoforge-${{ matrix.target }}
          path: |
            src/neoforge/${{ matrix.target }}/build/libs/ecera-neoforge-${{ matrix.target }}-*.jar
            src/test/build/test-results/

  forge-1-19-2:
    name: Forge 1.19.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin 17
        id: java17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch verified Machinera 2.0.0 Forge 1.19.2 JAR (external to repo)
        run: |
          mkdir -p ../.mhera-libs
          JAR="../.mhera-libs/mhera-forge-1.19.2-$MHERA_VERSION.jar"
          curl -fsSL "$MHERA_RELEASE_URL/mhera-forge-1.19.2-$MHERA_VERSION.jar" -o "$JAR"

      - name: Build and reobfuscate Forge 1.19.2 JAR
        working-directory: forge-1.19.2
        run: |
          ./gradlew :forge:1.19.2:build \
            --no-daemon --console=plain \
            -Dorg.gradle.internal.http.connectionTimeout=120000 \
            -Dorg.gradle.internal.http.socketTimeout=120000 \
            -Porg.gradle.java.installations.paths="${{ steps.java17.outputs.path }}"

      - name: Audit packaged Forge 1.19.2 JAR
        run: |
          python3 tools/ci/audit_jars.py \
            --jar "forge-1.19.2/forge/1.19.2/build/libs/ecera-forge-1.19.2-2.0.0.jar" \
            --target "forge-1.19.2"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecera-forge-1.19.2
          path: forge-1.19.2/forge/1.19.2/build/libs/ecera-forge-1.19.2-*.jar
